-size:25px}.stockstats .selected small{color:#263b59}.stocktop{display:flex;justify-content:space-between;gap:8px}.stocknumbers{margin:10px 0}.stocknumbers strong{font-size:24px;letter-spacing:-.5px}.stockitem{margin:8px 0;padding:14px}.stockitem b{display:block;margin:6px 0}.stockalert{border-left:3px solid #f4c36b}.stockalert h3{margin:0}.alertrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}.alertrow strong{font-size:12px}.stockalert button{margin-top:12px;width:100%;background:#26364c;color:#e2ecff}</style><main><header><div class="brand">MX</div><div><h1>MIX Assistant</h1><small>Рабочее пространство · v0.8.2</small></div></header><nav id="nav"></nav><div id="view"></div></main><script>
const initial={kpi:['BEER','Flash','CSD','Lipton'].map(name=>({name,fact:0,plan:0})),tasks:[],sales:[],clients:[],stock:[],pay:{base:0,bonus:0,ho:0,km:0,norm:0,price:0,amort:0}};let s;try{s=JSON.parse(localStorage.getItem('mix-v1'))||initial}catch{s=initial}let tab=0;const tabs=['Главная','Задачи','Продажи','Клиенты','Склад','Зарплата','Документы','Детализация','ChatGPT','Ещё'];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});function save(){try{localStorage.setItem('mix-v1',JSON.stringify(s))}catch{alert('Не удалось сохранить данные')}}function go(i){tab=i;render();window.scrollTo(0,0)}function pay(){let p=s.pay;return +p.base + +p.bonus + +p.ho + +p.km*+p.norm/100*+p.price + +p.amort}
const paths=['<path d="M3 10 12 3l9 7v10H3z"/><path d="M9 20v-7h6v7"/>','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 12 2 2 5-5"/>','<path d="M4 20V4m0 16h16M8 15l4-5 4 2 4-7"/>','<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m2-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5"/>','<path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>','<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18m-5 5h2"/>','<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8m-8 4h8"/>','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/>','<path d="M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4Z"/><path d="M8 11h8m-4-4v8"/>','<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'];function ico(i){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[i]+'</svg>'}function shortcut(i,label){return '<button class="shortcut" onclick="go('+i+')">'+ico(i)+esc(label||tabs[i])+'</button>'}function render(){$('nav').innerHTML=[0,7,3,4,9].map(i=>'<button class="'+((tab===i||(i===9&&![0,7,3,4].includes(tab)))?'active':'')+'" onclick="go('+i+')" aria-label="'+tabs[i]+'">'+ico(i)+'<span>'+({7:'KPI',3:'Клиенты',9:'Ещё'}[i]||tabs[i])+'</span></button>').join('');let h='';if(tab===0){h='<div class="pagehead">Обзор продаж</div><div class="meta"><small>'+esc(new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}))+'</small><small>Локальные данные</small></div><div class="grid kpis">'+s.kpi.map(k=>{let p=k.plan?k.fact/k.plan*100:0;return '<section class="kpi" style="--tone:'+(k.plan?(p>=100?'#66d5ac':p>=90?'#f4c36b':'#ff929b'):'#a8c7ff')+'"><small>'+k.name+'</small><h2>'+(k.plan?fmt(p)+'%':'—')+'</h2><progress max="120" value="'+Math.min(120,p)+'"></progress><small>До 120%: '+(k.plan?fmt(Math.max(0,k.plan*1.2-k.fact))+' л':'—')+'</small></section>'}).join('')+'</div>'+stockAlert()+'<section><h3>Быстрые действия</h3><div class="menu">'+shortcut(7,'Загрузить KPI')+shortcut(4,'Остатки')+shortcut(8,'ChatGPT')+shortcut(1,'Задачи · '+s.tasks.filter(t=>!t.done).length)+'</div></section><section><details><summary>Ручное обновление KPI</summary>'+s.kpi.map((k,i)=>'<label>'+k.name+': факт / план, л</label><div class="grid"><input type="number" min="0" id="f'+i+'" value="'+k.fact+'"><input type="number" min="0" id="p'+i+'" value="'+k.plan+'"></div>').join('')+'<button onclick="updateKpi()">Сохранить</button></details></section><button onclick="backup()">Экспорт данных</button>'}else if(tab===9){h='<div class="pagehead">Все инструменты</div><section><div class="menu">'+[1,2,3,4,5,6,7,8].map(i=>shortcut(i)).join('')+'</div></section><section><h3>Данные</h3><button onclick="backup()">Экспорт резервной копии</button><p><small>Данные хранятся в этом браузере. Экспорт не включает исходные документы.</small></p></section>'}else if(tab===1){h='<section><h3>Новое поручение</h3><label>Задача</label><textarea id="task"></textarea><label>Супервайзер</label><input id="boss"><label>Срок</label><input type="date" id="due"><label>Приоритет</label><select id="priority"><option>Обычный</option><option>Высокий</option><option>Срочный</option></select><button onclick="addTask()">Добавить</button></section><section><h3>Реестр задач</h3>'+(s.tasks.map((t,i)=>'<div class="task"><b>'+esc(t.name)+'</b><br><small>'+esc(t.boss)+' · '+esc(t.due||'Без срока')+' · '+esc(t.priority)+(t.done?' · Выполнено':t.due&&t.due<new Date().toLocaleDateString('sv-SE')?' · ПРОСРОЧЕНО':'')+'</small><br><button onclick="toggle('+i+')">'+(t.done?'Возобновить':'Выполнено')+'</button> <button onclick="del(\'tasks\','+i+')">Удалить</button></div>').join('')||'Пока нет задач')+'</section>'}else if(tab===5){h='<section><h3>Расчёт начислений</h3><label>Импорт авторасчёта ЦОТ (Excel)</label><input type="file" accept=".xlsx" onchange="if(this.files[0])readPayroll(this.files[0])"><div id="payimport"></div>'+Object.entries({base:'Оклад, ₸',bonus:'Премии, ₸',ho:'Премия ХО, ₸',km:'Пробег, км',norm:'Норма топлива, л/100 км',price:'Цена топлива, ₸/л',amort:'Амортизация, ₸'}).map(([k,v])=>'<label>'+v+'</label><input type="number" min="0" id="pay_'+k+'" value="'+s.pay[k]+'">').join('')+'<button onclick="updatePay()">Пересчитать</button><h2 class="money">'+fmt(pay())+' ₸</h2><small>Налоги не учтены.</small></section>'}else if(tab===8){h=chatUI()}else if(tab===7){h=detailUI()}else if(tab===4){h=stockUI()}else if(tab===6){h='<section><h3>Загрузка документов</h3><label>Тип документа</label><select id="doctype"><option>Детализация KPI</option><option>Складские остатки</option><option>Клиентская база</option><option>Дневные продажи</option><option>Накладные</option></select><input type="file" id="docfile" multiple accept=".xlsx,.xls,.csv,.pdf,.txt,image/*"><textarea id="pastezone" placeholder="Нажми сюда и выбери Вставить или Ctrl+V" onpaste="pasteDocs(event)" ondragover="event.preventDefault()" ondrop="dropDocs(event)"></textarea><button onclick="readClipboard()">Вставить из буфера</button> <button onclick="uploadDocs()">Сохранить файлы</button><p id="docstatus"></p><small>Файлы сохраняются на устройстве. Анализ складского PDF доступен в разделе Склад. Анализ KPI доступен в разделе Детализация.</small></section><section id="doclist">Загрузка списка…</section>';setTimeout(listDocs,0)}else if(tab===3){h='<section><h3>Клиентская база · '+s.clients.length+' ТТ</h3><label>Импорт списка (название; адрес; ИП)</label><input type="file" id="clientfile" accept=".csv,.txt"><button onclick="importClients()">Импортировать</button><input id="clientsearch" placeholder="Поиск точки" oninput="filterClients(this.value)"><label>Название</label><input id="a"><label>Адрес / ИП</label><input id="b"><button onclick="addRow(\'clients\')">Добавить</button></section><section id="clientlist">'+clientRows('')+'</section>'}else{let [key,title,a,b]={2:['sales','Продажа','Торговая точка','Объём, л'],3:['clients','Клиент','Название','Адрес / заметка'],4:['stock','Остаток','Товар','Количество / единица']}[tab];h='<section><h3>'+title+'</h3><label>'+a+'</label><input id="a"><label>'+b+'</label><input id="b"><button onclick="addRow(\''+key+'\')">Добавить</button></section><section>'+(s[key].map((r,i)=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><small>'+esc(r.date)+'</small><br><button onclick="del(\''+key+'\','+i+')">Удалить</button></div>').join('')||'Нет записей')+'</section>'}$('view').innerHTML=h}

let payrollRows=[];
async function readPayroll(file){let el=$('payimport');el.textContent='Читаю Excel…';try{let x=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'),w=x.read(await file.arrayBuffer(),{type:'array'}),sheet=w.SheetNames.find(n=>n.includes('Авторасчет ЦОТ'));if(!sheet)throw Error('Не найден лист авторасчёта ЦОТ');let a=x.utils.sheet_to_json(w.Sheets[sheet],{header:1,defval:null}),h=a[0],idx=t=>h.findIndex(v=>String(v).trim()===t);if(idx('Маршрут')<0||idx('Окладная часть')<0)throw Error('Не найдены обязательные столбцы');payrollRows=a.slice(1).filter(r=>r[idx('Маршрут')]&&r[idx('Окладная часть')]).map(r=>({name:r[idx('Маршрут')],base:r[idx('Окладная часть')],bonus:r[idx('Тотал стоимость услуг')],travel:r[45],km:r[idx('пройдено км')],metrics:['BEER','LIPTON','CSD',' Flash-Up'].map(n=>({name:n.trim(),plan:r[idx('Вторичные продажи '+n+', план')],fact:r[idx('Вторичные продажи '+n+', факт')],amount:r[idx('Вторичные продажи '+n+', сумма')]}))}));el.innerHTML='<label>Выберите свой маршрут</label><select id="payroute" onchange="previewPayroll()"><option value="">Выберите</option>'+payrollRows.map((r,i)=>'<option value="'+i+'">'+esc(r.name)+'</option>').join('')+'</select><div id="paypreview"></div>'}catch(e){el.textContent='Ошибка: '+e.message}}
function previewPayroll(){let v=$('payroute').value,el=$('paypreview');if(v===''){el.textContent='';return}let r=payrollRows[+v];el.innerHTML='<p>Оклад: '+fmt(r.base)+' ₸ · Начисления KPI: '+fmt(r.bonus)+' ₸ · ГСМ и амортизация: '+fmt(r.travel)+' ₸</p>'+r.metrics.map(m=>'<div>'+esc(m.name)+': '+fmt(m.fact)+' / '+fmt(m.plan)+' · '+fmt(m.amount)+' ₸</div>').join('')+'<p><small>Исторический расчёт. Не заменяет текущие KPI и прогноз.</small></p>'}

function detailUI(){let d=s.detail;return '<section><h3>Детализация KPI</h3><input type="file" accept=".xlsx,.xls" onchange="if(this.files[0])loadDetail(this.files[0])"><textarea placeholder="Вставьте Excel из буфера" onpaste="detailPaste(event)"></textarea><button onclick="detailClipboard()">Вставить из буфера</button><p id="detailstatus"></p><small>'+esc(d?.name||'Отчёт не загружен')+'</small></section>'+(d?'<section><h3>План продаж</h3><label>Цель, %</label><select id="dgoal" onchange="detailResults()"><option>90</option><option selected>100</option><option>110</option><option>120</option></select><label>Осталось рабочих дней</label><input id="ddays" type="number" min="1" value="2" onchange="detailResults()"><div id="dresults">'+detailMetrics(100,2)+'</div><p>Пробег: '+fmt(d.km)+' км</p><p>Визиты: '+fmt(d.visits.fact)+' / '+fmt(d.visits.plan)+'</p></section><section><h3>Flash: незакрытые позиции</h3><small>Нет положительного значения в отчёте за месяц; пустые ячейки не доказывают отсутствие продаж.</small><input placeholder="Поиск магазина" oninput="detailShops(this.value)"><div id="dshops">'+shopRows('')+'</div></section><section><h3>FIT по точкам</h3>'+d.fit.map(t=>'<div class="task">'+esc(t.name)+'<br>Beer: '+fmt(t.beer*100)+'% · NonAlco: '+fmt(t.non*100)+'%</div>').join('')+'</section>':'')}
function detailMetrics(goal,days){let d=s.detail,p=s.detailPrevious;return d.kpi.map(k=>{let old=d.period&&p?.period===d.period?p.kpi.find(x=>x.name===k.name):null,left=Math.max(0,k.plan*goal/100-k.fact);return '<div class="task"><b>'+k.name+' · '+fmt(k.fact/k.plan*100)+'%</b><br>'+fmt(k.fact)+' / '+fmt(k.plan)+' л<br>До '+goal+'%: '+fmt(left)+' л · '+fmt(left/days)+' л/день'+(k.name==='Flash'?' · '+Math.ceil(left/days/10.32)+' уп. 0,43 × 24/день':'')+(old?'<br>Изменение: '+fmt(k.fact-old.fact)+' л':'')+'</div>'}).join('')}
function detailResults(){$('dresults').innerHTML=detailMetrics(+$('dgoal').value,Math.max(1,+$('ddays').value))}
function shopRows(q){return s.detail.shops.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())).map(t=>'<div class="task"><b>'+esc(t.name)+'</b><br>'+esc(t.missing.join('; ')||'Все выбранные группы имеют положительное значение')+'</div>').join('')||'Нет точек'}
function detailShops(q){$('dshops').innerHTML=shopRows(q)}
function detailPaste(e){let f=Array.from(e.clipboardData.files||[])[0];if(f){e.preventDefault();loadDetail(f)}else{e.preventDefault();$('detailstatus').textContent='Буфер не передал Excel целиком. Выберите файл.'}}

async function loadDetail(file){let el=$('detailstatus');el.textContent='Читаю Excel…';try{let x=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'),w=x.read(await file.arrayBuffer(),{type:'array'}),read=n=>{if(!w.Sheets[n])throw Error('Нет листа '+n);let sheet=w.Sheets[n],rows=[];for(let [addr,cell] of Object.entries(sheet)){if(!/^[A-Z]+[0-9]+$/.test(addr))continue;let pos=x.utils.decode_cell(addr);if(!rows[pos.r])rows[pos.r]=[];rows[pos.r][pos.c]=cell.v}return Array.from(rows,r=>r||[])},a=read('Sheet1'),v=read('Sheet2'),m=read('Sheet3'),b=read('Sheet4'),f=read('Sheet5'),num=z=>typeof z==='number'&&Number.isFinite(z),period=a.slice(0,8).flat().map(z=>String(z??'')).join(' ').match(/\b(0[1-9]|1[0-2])\.(20\d{2})\b/)?.[0]||file.name.match(/(20\d{2})(0[1-9]|1[0-2])\d{2}/)?.slice(1,3).reverse().join('.')||null;let norm=z=>String(z??'').trim().toLowerCase().replace(/\s+/g,' '),kh=a.findIndex(r=>norm(r[2]).includes('kpi')),sh=b.findIndex(r=>norm(r[4])==='shop id');if(kh<0||sh<0)throw Error('Не найдены заголовки: KPI '+kh+', Shop Id '+sh+'. Листы: '+w.SheetNames.join(', '));let kpi=['BEER','Flash','CSD','Lipton'].map((name,i)=>{let r=a.slice(kh+1).find(r=>norm(r[2]).includes(name.toLowerCase())&&num(r[5])&&num(r[7]));if(!String(r?.[2]).toLowerCase().includes(name.toLowerCase())||!num(r[5])||!num(r[7])||r[7]<=0)throw Error('Некорректный KPI '+name);return {name,fact:r[5]*10,plan:r[7]*10}});let visits={plan:0,fact:0};for(let r of v.slice(9))if(r[4]&&r[5]&&num(r[7])&&num(r[8])){visits.plan+=r[7];visits.fact+=r[8]}let km=m.slice(6).filter(r=>num(r[2])&&num(r[4])).reduce((a,r)=>a+r[4],0);let groups=[{name:'Ultra',re:/ultra.*0[.,]4[35]/i},{name:'Classic',re:/energy.*0[.,]4[35]/i},{name:'0,25',re:/0[.,]25/i}];let cols=Array.from(b[sh],(n,i)=>({n:String(n||''),i})).filter(o=>o.i>=35&&o.i<=46);groups[1].re=/^(?!.*(?:ultra|bubble|exotic|mojito|pomegranate|night|peach|morning|berry|tropical|mango|apple)).*energy.*0[.,]4[35]/i;let shops=new Map(),cur=null;for(let r of b.slic function pasteDocs(e){let files=Array.from(e.clipboardData.files||[]);if(!files.length)files=Array.from(e.clipboardData.items||[]).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();uploadDocs(files)}else{let t=e.clipboardData.getData('text/plain');if(t){e.preventDefault();uploadDocs([new File([t],'Вставленный текст.txt',{type:'text/plain'})])}}}function dropDocs(e){e.preventDefault();let files=Array.from(e.dataTransfer.files);if(files.length)uploadDocs(files)}async function readClipboard(){try{let items=await navigator.clipboard.read(),files=[];for(let item of items){let type=item.types.find(t=>t!=='text/plain'&&t!=='text/html')||item.types.find(t=>t==='text/plain');if(!type)continue;let blob=await item.getType(type),ext=({'image/png':'png','image/jpeg':'jpg','application/pdf':'pdf','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','text/plain':'txt'})[type]||'bin';files.push(new File([blob],'Буфер-'+Date.now()+'-'+files.length+'.'+ext,{type}))}if(files.length)uploadDocs(files);else alert('Буфер не содержит доступных файлов')}catch{alert('Браузер не разрешил чтение буфера. Нажмите на поле вставки и выберите Вставить. Если файл не передаётся, используйте выбор файла.')}}function docDB(){return new Promise((ok,no)=>{let r=indexedDB.open('mix-documents',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function uploadDocs(incoming){let files=incoming||Array.from($('docfile').files),type=$('doctype').value;if(!files.length)return alert('Выберите файл');try{let db=await docDB(),tx=db.transaction('files','readwrite');for(let file of files)tx.objectStore('files').add({file,name:file.name,type,date:new Date().toLocaleString('ru-RU')});await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=no;tx.onabort=no});db.close();if($('docstatus'))$('docstatus').textContent='Сохранено: '+files.length;listDocs()}catch(e){alert('Не удалось сохранить файлы')}}async function listDocs(){try{let db=await docDB(),r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>{if($('doclist'))$('doclist').innerHTML=r.result.map(d=>'<div class="task"><b>'+esc(d.name)+'</b><br><small>'+esc(d.type)+' · '+esc(d.date)+'</small><br><button onclick="getDoc('+d.id+')">Открыть файл</button> <button onclick="deleteDoc('+d.id+')">Удалить</button></div>').join('')||'Нет документов';db.close()}}catch(e){if($('doclist'))$('doclist').textContent='Хранилище недоступно'}}async function getDoc(id){let db=await docDB(),r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(r.result){let a=document.createElement('a');a.href=URL.createObjectURL(r.result.file);a.download=r.result.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}db.close()}}async function deleteDoc(id){if(!confirm('Удалить файл?'))return;let db=await docDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();listDocs()}}function clientRows(q){return s.clients.map((r,i)=>({r,i})).filter(({r})=>(r.a+' '+r.b).toLowerCase().includes(q.toLowerCase())).map(({r,i})=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><button onclick="del(\'clients\','+i+')">Удалить</button></div>').join('')||'Нет записей'}function filterClients(q){$('clientlist').innerHTML=clientRows(q)}async function importClients(){let f=$('clientfile').files[0];if(!f)return alert('Выберите файл');let rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.split(';').map(y=>y.trim())).filter(x=>x.length>=2&&x[0]&&x[0]!=='Название');let n=0;for(let [a,address,ip] of rows){let b=address+(ip?' · '+ip:'');if(!s.clients.some(r=>r.a===a&&r.b===b)){s.clients.push({a,b,date:new Date().toLocaleDateString('ru-RU')});n++}}save();render();alert('Добавлено: '+n)}function updateKpi(){s.kpi.forEach((k,i)=>{k.fact=Math.max(0,+$('f'+i).value);k.plan=Math.max(0,+$('p'+i).value)});save();render()}function addTask(){if(!$('task').value.trim())return;s.tasks.push({name:$('task').value,boss:$('boss').value,due:$('due').value,priority:$('priority').value,done:false});save();render()}function toggle(i){s.tasks[i].done=!s.tasks[i].done;save();render()}function del(k,i){if(confirm('Удалить запись?')){s[k].splice(i,1);save();render()}}function addRow(k){if(!$('a').value.trim())return;s[k].push({a:$('a').value,b:$('b').value,date:new Date().toLocaleDateString('ru-RU')});save();render()}function updatePay(){Object.keys(s.pay).forEach(k=>s.pay[k]=Math.max(0,+$('pay_'+k).value));save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='mix-backup.json';a.click();URL.revokeObjectURL(a.href)}render();</script></html>
