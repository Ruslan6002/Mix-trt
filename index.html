const initial={kpi:['BEER','Flash','CSD','Lipton'].map(name=>({name,fact:0,plan:0})),tasks:[],sales:[],clients:[],stock:[],pay:{base:0,bonus:0,ho:0,km:0,norm:0,price:0,amort:0}};let s;try{s=JSON.parse(localStorage.getItem('mix-v1'))||initial}catch{s=initial}let tab=0;const tabs=['Главная','Задачи','Продажи','Клиенты','Склад','Зарплата','Документы','Детализация','ChatGPT','Ещё'];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});function save(){try{localStorage.setItem('mix-v1',JSON.stringify(s))}catch{alert('Не удалось сохранить данные')}}function go(i){tab=i;render();window.scrollTo(0,0)}function pay(){let p=s.pay;return +p.base + +p.bonus + +p.ho + +p.km*+p.norm/100*+p.price + +p.amort}
const paths=['<path d="M3 10 12 3l9 7v10H3z"/><path d="M9 20v-7h6v7"/>','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="m8 12 2 2 5-5"/>','<path d="M4 20V4m0 16h16M8 15l4-5 4 2 4-7"/>','<circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3m2-15a3 3 0 0 1 0 6m1 3a5 5 0 0 1 3 5"/>','<path d="m3 7 9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>','<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18m-5 5h2"/>','<path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8m-8 4h8"/>','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/>','<path d="M21 11a9 9 0 0 1-9 9H3l2-5a9 9 0 1 1 16-4Z"/><path d="M8 11h8m-4-4v8"/>','<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'];function ico(i){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[i]+'</svg>'}function shortcut(i,label){return '<button class="shortcut" onclick="go('+i+')">'+ico(i)+esc(label||tabs[i])+'</button>'}function render(){$('nav').innerHTML=[0,7,3,4,9].map(i=>'<button class="'+((tab===i||(i===9&&![0,7,3,4].includes(tab)))?'active':'')+'" onclick="go('+i+')" aria-label="'+tabs[i]+'">'+ico(i)+'<span>'+({7:'KPI',3:'Клиенты',9:'Ещё'}[i]||tabs[i])+'</span></button>').join('');let h='';if(tab===0){h='<div class="pagehead">Обзор продаж</div><div class="meta"><small>'+esc(new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}))+'</small><small>Локальные данные</small></div><div class="grid kpis">'+s.kpi.map(k=>{let p=k.plan?k.fact/k.plan*100:0;return '<section class="kpi" style="--tone:'+(k.plan?(p>=100?'#66d5ac':p>=90?'#f4c36b':'#ff929b'):'#a8c7ff')+'"><small>'+k.name+'</small><h2>'+(k.plan?fmt(p)+'%':'—')+'</h2><progress max="120" value="'+Math.min(120,p)+'"></progress><small>До 120%: '+(k.plan?fmt(Math.max(0,k.plan*1.2-k.fact))+' л':'—')+'</small></section>'}).join('')+'</div>'+monoSummary()+'<section><h3>План на день</h3><button onclick="go(3)">Открыть маршрут</button></section><section><h3>Импорт из WhatsApp</h3><button onclick="importShortcut()">Вставить отчёт из буфера</button><details><summary>Если вставка не работает</summary><textarea id="shortcutpaste" placeholder="Вставьте код из команды"></textarea><button onclick="importShortcut(true)">Обработать</button></details><p id="shortcutstatus" role="status"></p></section>'+stockAlert()+'<section><h3>Быстрые действия</h3><div class="menu">'+shortcut(7,'Загрузить KPI')+shortcut(4,'Остатки')+shortcut(8,'ChatGPT')+shortcut(1,'Задачи · '+s.tasks.filter(t=>!t.done).length)+'</div></section><section><details><summary>Ручное обновление KPI</summary>'+s.kpi.map((k,i)=>'<label>'+k.name+': факт / план, л</label><div class="grid"><input type="number" min="0" id="f'+i+'" value="'+k.fact+'"><input type="number" min="0" id="p'+i+'" value="'+k.plan+'"></div>').join('')+'<button onclick="updateKpi()">Сохранить</button></details></section><button onclick="backup()">Экспорт данных</button>'}else if(tab===2){h=monoUI()}else if(tab===9){h='<div class="pagehead">Все инструменты</div><section><div class="menu">'+[1,2,3,4,5,6,7,8].map(i=>shortcut(i)).join('')+'</div></section><section><h3>Данные</h3><button onclick="backup()">Экспорт резервной копии</button><p><small>Данные хранятся в этом браузере. Экспорт не включает исходные документы.</small></p></section>'}else if(tab===1){h='<section><h3>Новое поручение</h3><label>Задача</label><textarea id="task"></textarea><label>Супервайзер</label><input id="boss"><label>Срок</label><input type="date" id="due"><label>Приоритет</label><select id="priority"><option>Обычный</option><option>Высокий</option><option>Срочный</option></select><button onclick="addTask()">Добавить</button></section><section><h3>Реестр задач</h3>'+(s.tasks.map((t,i)=>'<div class="task"><b>'+esc(t.name)+'</b><br><small>'+esc(t.boss)+' · '+esc(t.due||'Без срока')+' · '+esc(t.priority)+(t.done?' · Выполнено':t.due&&t.due<new Date().toLocaleDateString('sv-SE')?' · ПРОСРОЧЕНО':'')+'</small><br><button onclick="toggle('+i+')">'+(t.done?'Возобновить':'Выполнено')+'</button> <button onclick="del(\'tasks\','+i+')">Удалить</button></div>').join('')||'Пока нет задач')+'</section>'}else if(tab===5){h='<section><h3>Расчёт начислений</h3><label>Импорт авторасчёта ЦОТ (Excel)</label><input type="file" accept=".xlsx" onchange="if(this.files[0])readPayroll(this.files[0])"><div id="payimport"></div>'+Object.entries({base:'Оклад, ₸',bonus:'Премии, ₸',ho:'Премия ХО, ₸',km:'Пробег, км',norm:'Норма топлива, л/100 км',price:'Цена топлива, ₸/л',amort:'Амортизация, ₸'}).map(([k,v])=>'<label>'+v+'</label><input type="number" min="0" id="pay_'+k+'" value="'+s.pay[k]+'">').join('')+'<button onclick="updatePay()">Пересчитать</button><h2 class="money">'+fmt(pay())+' ₸</h2><small>Налоги не учтены.</small></section>'}else if(tab===8){h=chatUI()}else if(tab===7){h=detailUI()}else if(tab===4){h=stockUI()}else if(tab===6){h='<section><h3>Загрузка документов</h3><label>Тип документа</label><select id="doctype"><option>Детализация KPI</option><option>Складские остатки</option><option>Клиентская база</option><option>Дневные продажи</option><option>Накладные</option></select><input type="file" id="docfile" multiple accept=".xlsx,.xls,.csv,.pdf,.txt,image/*"><textarea id="pastezone" placeholder="Нажми сюда и выбери Вставить или Ctrl+V" onpaste="pasteDocs(event)" ondragover="event.preventDefault()" ondrop="dropDocs(event)"></textarea><button onclick="readClipboard()">Вставить из буфера</button> <button onclick="uploadDocs()">Сохранить файлы</button><p id="docstatus"></p><small>Файлы сохраняются на устройстве. Анализ складского PDF доступен в разделе Склад. Анализ KPI доступен в разделе Детализация.</small></section><section id="doclist">Загрузка списка…</section>';setTimeout(listDocs,0)}else if(tab===3){h=routeUI()+'<section><h3>Клиентская база · '+s.clients.length+' ТТ</h3><label>Импорт списка (название; адрес; ИП)</label><input type="file" id="clientfile" accept=".csv,.txt"><button onclick="importClients()">Импортировать</button><input id="clientsearch" placeholder="Поиск точки" oninput="filterClients(this.value)"><label>Название</label><input id="a"><label>Адрес / ИП</label><input id="b"><button onclick="addRow(\'clients\')">Добавить</button></section><section id="clientlist">'+clientRows('')+'</section>'}else{let [key,title,a,b]={2:['sales','Продажа','Торговая точка','Объём, л'],3:['clients','Клиент','Название','Адрес / заметка'],4:['stock','Остаток','Товар','Количество / единица']}[tab];h='<section><h3>'+title+'</h3><label>'+a+'</label><input id="a"><label>'+b+'</label><input id="b"><button onclick="addRow(\''+key+'\')">Добавить</button></section><section>'+(s[key].map((r,i)=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><small>'+esc(r.date)+'</small><br><button onclick="del(\''+key+'\','+i+')">Удалить</button></div>').join('')||'Нет записей')+'</section>'}$('view').innerHTML=h}

let payrollRows=[];
async function readPayroll(file){let el=$('payimport');el.textContent='Читаю Excel…';try{let x=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'),w=x.read(await file.arrayBuffer(),{type:'array'}),sheet=w.SheetNames.find(n=>n.includes('Авторасчет ЦОТ'));if(!sheet)throw Error('Не найден лист авторасчёта ЦОТ');let a=x.utils.sheet_to_json(w.Sheets[sheet],{header:1,defval:null}),h=a[0],idx=t=>h.findIndex(v=>String(v).trim()===t);if(idx('Маршрут')<0||idx('Окладная часть')<0)throw Error('Не найдены обязательные столбцы');payrollRows=a.slice(1).filter(r=>r[idx('Маршрут')]&&r[idx('Окладная часть')]).map(r=>({name:r[idx('Маршрут')],base:r[idx('Окладная часть')],bonus:r[idx('Тотал стоимость услуг')],travel:r[45],km:r[idx('пройдено км')],metrics:['BEER','LIPTON','CSD',' Flash-Up'].map(n=>({name:n.trim(),plan:r[idx('Вторичные продажи '+n+', план')],fact:r[idx('Вторичные продажи '+n+', факт')],amount:r[idx('Вторичные продажи '+n+', сумма')]}))}));el.innerHTML='<label>Выберите свой маршрут</label><select id="payroute" onchange="previewPayroll()"><option value="">Выберите</option>'+payrollRows.map((r,i)=>'<option value="'+i+'">'+esc(r.name)+'</option>').join('')+'</select><div id="paypreview"></div>'}catch(e){el.textContent='Ошибка: '+e.message}}
function previewPayroll(){let v=$('payroute').value,el=$('paypreview');if(v===''){el.textContent='';return}let r=payrollRows[+v];el.innerHTML='<p>Оклад: '+fmt(r.base)+' ₸ · Начисления KPI: '+fmt(r.bonus)+' ₸ · ГСМ и амортизация: '+fmt(r.travel)+' ₸</p>'+r.metrics.map(m=>'<div>'+esc(m.name)+': '+fmt(m.fact)+' / '+fmt(m.plan)+' · '+fmt(m.amount)+' ₸</div>').join('')+'<p><small>Исторический расчёт. Не заменяет текущие KPI и прогноз.</small></p>'}

let detailTab='plan',detailQuery='',detailGroup='Все',detailOnly=true;

function stockSet(k,v){s.stockFilters={...stockPrefs(),[k]:v};save();refreshStock()}

function stockSummary(){let f=stockPrefs(),rows=stockBase().filter(r=>f.cat==='Все'||r.cat===f.cat);return '<div class="grid stockstats">'+[['all','Позиций',rows.length],['available','В наличии',rows.filter(r=>r.qty>0).length],['low','Мало',rows.filter(r=>r.qty>0&&r.qty/r.pack<f.limit).length],['zero','Нет',rows.filter(r=>r.qty===0).length]].map(([k,n,v])=>'<button class="stat '+(f.mode===k?'selected':'')+'" onclick="stockSet(\'mode\',\''+k+'\')"><small>'+n+'</small><strong>'+v+'</strong></button>').join('')+'</div>'}
function filteredStock(){let f=stockPrefs(),q=stockQuery.toLowerCase().replace(/,/g,'.').trim(),rows=stockBase().filter(r=>(f.cat==='Все'||r.cat===f.cat)&&r.name.toLowerCase().replace(/,/g,'.').includes(q)&&(f.mode==='all'||f.mode==='shortage'&&(r.qty===0||r.qty/r.pack<f.limit)||f.mode==='available'&&r.qty>0||f.mode==='low'&&r.qty>0&&r.qty/r.pack<f.limit||f.mode==='zero'&&r.qty===0));return rows.sort((a,b)=>f.sort==='asc'?a.qty/a.pack-b.qty/b.pack:f.sort==='desc'?b.qty/b.pack-a.qty/a.pack:a.name.localeCompare(b.name,'ru'))}
function stockResults(){if(!s.stockReport)return '<section>Загрузите отчёт</section>';let f=stockPrefs(),rows=filteredStock(),prev=new Map((s.stockPrevious?.rows||[]).map(r=>[r.name,r.qty]));let last='';rows.sort((a,b)=>['FLASH','CSD','LIPTON','BEER'].indexOf(a.cat)-['FLASH','CSD','LIPTON','BEER'].indexOf(b.cat));return '<p><small>Найдено: '+rows.length+'</small></p>'+rows.map(r=>{let low=r.qty/r.pack<f.limit,tone=r.qty===0?'#ff929b':low?(r.qty/r.pack<5?'#ffab70':'#f4c36b'):'#66d5ac',delta=prev.has(r.name)?r.qty-prev.get(r.name):null;let heading=last!==r.cat?'<h3 class="stockheading">'+({FLASH:'Flash',CSD:'Pepsi / 7UP / Mirinda',LIPTON:'Lipton',BEER:'Пиво'}[r.cat]||r.cat)+'</h3>':'';last=r.cat;return heading+'<section class="stockitem"><div class="stocktop"><small>'+esc(r.cat)+'</small><small style="color:'+tone+'">'+(r.qty===0?'Нет в наличии':low?(r.qty/r.pack<5?'Критический остаток':'Малый остаток'):'В наличии')+'</small></div><b>'+esc(r.name)+'</b><div class="stocktop stocknumbers"><div><strong>'+fmt(r.qty)+'</strong><small> '+(r.keg?'кег':'шт.')+'</small></div><div><strong>'+Math.floor(r.qty/r.pack)+'</strong><small> '+(r.keg?'кег':'уп.')+'</small></div></div><small>'+(r.keg?'':r.pack+' шт. в упаковке · остаток россыпью '+fmt(r.qty%r.pack)+' шт.')+(delta===null?'':' · Δ '+(delta>0?'+':'')+fmt(delta)+' шт.')+'</small></section>'}).join('')+(rows.length?'':'<section>Нет товаров по выбранным фильтрам</section>')+'<small>Пустое количество в строке товара считается нулём. Отсутствующие строки не считаются нулевыми. Старые названия Гуся скрываются при наличии соответствующей версии v3.</small>'}
function parseStock(lines){let rows=[];for(let line of lines){let m=line.trim().match(/^(.*?),\s*(бан|бут\.?|кега|шт\.?)(?:\s+([\d \u00a0\u202f]+),(\d{3}))?$/i);if(!m)continue;let name=m[1].trim(),qty=m[3]?Number(m[3].replace(/\s/g,''))+Number(m[4])/1000:0,pack=Number(name.match(/\*\s*(\d+)/)?.[1]||1),cat=/flash/i.test(name)?'FLASH':/липтон|lipton/i.test(name)?'LIPTON':/пиво|garage|somersby/i.test(name)?'BEER':'CSD';rows.push({name,qty,pack,cat,keg:/кега/i.test(m[2]),bib:/биб/i.test(name)})}return rows}
async function loadStock(file){let status=$('stockstatus');if(status)status.textContent='Читаю отчёт…';try{let lines=[];if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){let pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';let pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),tc=await page.getTextContent(),groups=[];for(let item of tc.items){if(!item.str?.trim())continue;let y=item.transform[5],g=groups.find(g=>Math.abs(g.y-y)<2);if(!g){g={y,items:[]};groups.push(g)}g.items.push(item)}for(let g of groups.sort((a,b)=>b.y-a.y))lines.push(g.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' '))}}else lines=(await file.text()).split(/\r?\n/);let rows=parseStock(lines);if(!rows.length)throw Error('Не найдены строки остатков. Проверьте формат PDF.');if(s.stockReport&&s.stockReport.name!==file.name)s.stockPrevious=s.stockReport;s.stockReport={name:file.name,rows,date:new Date().toISOString()};save();if(tab===4){render();$('stockstatus').textContent='Распознано позиций: '+rows.length}}catch(e){if(status)status.textContent='Ошибка: '+e.message;else alert(e.message)}}
function stockPaste(e){let f=Array.from(e.clipboardData.files||[])[0],t=e.clipboardData.getData('text/plain');if(f||t){e.preventDefault();loadStock(f||new File([t],'Вставленные остатки.txt',{type:'text/plain'}))}}
async function stockClipboard(){try{let items=await navigator.clipboard.read();for(let item of items){let type=item.types.includes('application/pdf')?'application/pdf':item.types.includes('text/plain')?'text/plain':null;if(type){let blob=await item.getType(type);await loadStock(new File([blob],type==='application/pdf'?'Остатки из буфера.pdf':'Остатки из буфера.txt',{type}));return}}throw Error()}catch{alert('Вставьте в текстовое поле или выберите PDF. Safari может не передавать PDF через буфер.')}}
async function copyStock(){let rows=filteredStock(),t=['Остатки '+(s.stockReport?.name||''),...rows.map(r=>r.cat+' | '+r.name+' — '+r.qty+' шт. / '+Math.floor(r.qty/r.pack)+' уп.')].join('\n');try{await navigator.clipboard.writeText(t);alert('Список скопирован')}catch{alert('Не удалось скопировать')}}
function pasteDocs(e){let files=Array.from(e.clipboardData.files||[]);if(!files.length)files=Array.from(e.clipboardData.items||[]).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();uploadDocs(files)}else{let t=e.clipboardData.getData('text/plain');if(t){e.preventDefault();uploadDocs([new File([t],'Вставленный текст.txt',{type:'text/plain'})])}}}function dropDocs(e){e.preventDefault();let files=Array.from(e.dataTransfer.files);if(files.length)uploadDocs(files)}async function readClipboard(){try{let items=await navigator.clipboard.read(),files=[];for(let item of items){let type=item.types.find(t=>t!=='text/plain'&&t!=='text/html')||item.types.find(t=>t==='text/plain');if(!type)continue;let blob=await item.getType(type),ext=({'image/png':'png','image/jpeg':'jpg','application/pdf':'pdf','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','text/plain':'txt'})[type]||'bin';files.push(new File([blob],'Буфер-'+Date.now()+'-'+files.length+'.'+ext,{type}))}if(files.length)uploadDocs(files);else alert('Буфер не содержит доступных файлов')}catch{alert('Браузер не разрешил чтение буфера. Нажмите на поле вставки и выберите Вставить. Если файл не передаётся, используйте выбор файла.')}}function docDB(){return new Promise((ok,no)=>{let r=indexedDB.open('mix-documents',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function uploadDocs(incoming){let files=incoming||Array.from($('docfile').files),type=$('doctype').value;if(!files.length)return alert('Выберите файл');try{let db=await docDB(),tx=db.transaction('files','readwrite');for(let file of files)tx.objectStore('files').add({file,name:file.name,type,date:new Date().toLocaleString('ru-RU')});await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=no;tx.onabort=no});db.close();if($('docstatus'))$('docstatus').textContent='Сохранено: '+files.length;listDocs()}catch(e){alert('Не удалось сохранить файлы')}}async function listDocs(){try{let db=await docDB(),r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>{if($('doclist'))$('doclist').innerHTML=r.result.map(d=>'<div class="task"><b>'+esc(d.name)+'</b><br><small>'+esc(d.type)+' · '+esc(d.date)+'</small><br><button onclick="getDoc('+d.id+')">Открыть файл</button> <button onclick="deleteDoc('+d.id+')">Удалить</button></div>').join('')||'Нет документов';db.close()}}catch(e){if($('doclist'))$('doclist').textContent='Хранилище недоступно'}}async function getDoc(id){let db=await docDB(),r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(r.result){let a=document.createElement('a');a.href=URL.createObjectURL(r.result.file);a.download=r.result.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}db.close()}}async function deleteDoc(id){if(!confirm('Удалить файл?'))return;let db=await docDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();listDocs()}}function clientRows(q){return s.clients.map((r,i)=>({r,i})).filter(({r})=>(r.a+' '+r.b).toLowerCase().includes(q.toLowerCase())).map(({r,i})=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><button onclick="del(\'clients\','+i+')">Удалить</button></div>').join('')||'Нет записей'}function filterClients(q){$('clientlist').innerHTML=clientRows(q)}async function importClients(){let f=$('clientfile').files[0];if(!f)return alert('Выберите файл');let rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.split(';').map(y=>y.trim())).filter(x=>x.length>=2&&x[0]&&x[0]!=='Название');let n=0;for(let [a,address,ip] of rows){let b=address+(ip?' · '+ip:'');if(!s.clients.some(r=>r.a===a&&r.b===b)){s.clients.push({a,b,date:new Date().toLocaleDateString('ru-RU')});n++}}save();render();alert('Добавлено: '+n)}function updateKpi(){s.kpi.forEach((k,i)=>{k.fact=Math.max(0,+$('f'+i).value);k.plan=Math.max(0,+$('p'+i).value)});save();render()}function addTask(){if(!$('task').value.trim())return;s.tasks.push({name:$('task').value,boss:$('boss').value,due:$('due').value,priority:$('priority').value,done:false});save();render()}function toggle(i){s.tasks[i].done=!s.tasks[i].done;save();render()}function del(k,i){if(confirm('Удалить запись?')){s[k].splice(i,1);save();render()}}function addRow(k){if(!$('a').value.trim())return;s[k].push({a:$('a').value,b:$('b').value,date:new Date().toLocaleDateString('ru-RU')});save();render()}function updatePay(){Object.keys(s.pay).forEach(k=>s.pay[k]=Math.max(0,+$('pay_'+k).value));save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='mix-backup.json';a.click();URL.revokeObjectURL(a.href)}

function routeDate(){return s.routeDay||new Date().toLocaleDateString('sv-SE')}
function routeKey(r){return r.name+'\u001f'+(r.address||'')}
function routeRows(day){if(s.routes?.[day])return s.routes[day];return (s.weekRoute?.[new Date(day+'T12:00:00').getDay()]||[]).map(x=>typeof x==='string'?{name:x}:{...x})}
function routeScope(){return $('routeScope')?.value==='week'}
function routeSearch(q){let v=q.toLowerCase().trim();return s.clients.map((r,i)=>({r,i})).filter(({r})=>(r.a+' '+r.b).toLowerCase().includes(v)).slice(0,40).map(({r,i})=>'<div class="task"><b>'+esc(r.a)+'</b><br><small>'+esc(r.b)+'</small><br><button onclick="routeAdd('+i+')">Добавить</button></div>').join('')||'<small>Нет совпадений. Добавьте клиента в базу ниже.</small>'}

function routeChange(row,remove,weekly){let day=routeDate(),dow=new Date(day+'T12:00:00').getDay(),key=routeKey(row),change=arr=>{let a=arr.map(x=>typeof x==='string'?{name:x}:x);let match=x=>routeKey(x)===key;return remove?a.filter(x=>!match(x)):a.some(match)?a:[...a,{name:row.name,address:row.address||''}]};s.routes??={};if(weekly){s.weekRoute??={};s.weekRoute[dow]=change(s.weekRoute[dow]||[]);if(s.routes[day])s.routes[day]=change(s.routes[day])}else{s.routes[day]=change(routeRows(day))}save();render()}
function routeAdd(i){let r=s.clients[i];if(r)routeChange({name:r.a,address:r.b},false,routeScope())}
function routeRemove(i){let row=routeRows(routeDate())[i];if(!row)return;let weekly=confirm('Удалить из постоянного маршрута этого дня недели? OK — постоянно, Отмена — выбрать разовое удаление.');if(weekly||confirm('Удалить только на выбранную дату?'))routeChange(row,true,weekly)}

function routeNorm(x,keep=false){let t=String(x||'').toLowerCase().split('(')[0].replace(/ё/g,'е').replace(/[\x60"'«»]/g,'').trim();if(!keep)t=t.replace(/^(магазин|маг)\.?\s+/,'');return t.replace(/cарлык/g,'сарлык').replace(/\s+/g,'')}
function routeMatch(rows,name){let exact=rows.filter(t=>routeNorm(t.name,true)===routeNorm(name,true));if(exact.length===1)return exact[0];let loose=rows.filter(t=>routeNorm(t.name)===routeNorm(name));return loose.length===1?loose[0]:null}
function routeWeekDay(d){let day=routeDate(),dow=new Date(day+'T12:00:00').getDay();s.routeDay=monoDay(day,d-(dow||7));save();render()}
function routeFitValue(v){return typeof v==='number'&&Number.isFinite(v)?fmt(v*100)+'%':'Нет данных'}

let routeFilter='all',routeQuery='';

function routeFitTile(label,v){let valid=typeof v==='number'&&Number.isFinite(v),p=valid?v*100:0;return '<div class="rtfit"><small>'+label+'</small><strong>'+routeFitValue(v)+'</strong><div class="rttrack"><i style="width:'+Math.max(0,Math.min(100,p))+'%;background:'+(p>=100?'#66d5ac':'#79aaff')+'"></i></div></div>'}
function routeCards(){let rows=routeRows(routeDate()),fit=s.detail?.fit||[],shops=s.detail?.shops||[];return rows.map((r,i)=>({r,i})).filter(({r})=>{let st=r.status||'Не посещено';return (routeFilter==='all'||(routeFilter==='todo'?st==='Не посещено':st!=='Не посещено'))&&(r.name+' '+(r.address||'')).toLowerCase().includes(routeQuery.toLowerCase())}).map(({r,i})=>{let t=routeMatch(shops,r.name),fm=routeMatch(fit,r.name),st=r.status||'Не посещено';return '<section class="rtcard"><div class="rttop"><span class="rtnum">'+(i+1)+'</span><div class="rtname"><b>'+esc(r.name)+'</b>'+(r.address?'<small>'+esc(r.address)+'</small>':'')+'</div><span class="rtstatus '+(st==='Посещено'?'rtgreen':st==='Не посещено'?'':'rtamber')+'">'+esc(st)+'</span></div><div class="grid rtmetrics">'+routeFitTile('FIT Beer',fm?.beer)+routeFitTile('FIT NonAlco',fm?.non)+'</div><div class="rtflash"><small>Flash</small><div>'+(t?(t.missing.length?t.missing.map(n=>'<span class="missingchip">'+esc(n)+'</span>').join(' '):'<span class="rtgreen">Все группы закрыты</span>'):'<small>Нет однозначных данных</small>')+'</div></div><div class="rtactions"><button class="'+(st==='Посещено'?'rtactive':'')+'" onclick="routeStatus('+i+',\'Посещено\')">✓ Посещено</button><button class="'+(st==='Закрыто'?'rtactive':'')+'" onclick="routeStatus('+i+',\'Закрыто\')">Закрыто</button><button class="'+(st==='Без заказа'?'rtactive':'')+'" onclick="routeStatus('+i+',\'Без заказа\')">Без заказа</button></div><details class="rtdetails"><summary>Заметка и действия'+(r.note?' · есть заметка':'')+'</summary><textarea placeholder="Заметка по точке" onchange="routeNote('+i+',this.value)">'+esc(r.note||'')+'</textarea><div class="rtactions"><button onclick="routeStatus('+i+',\'Не посещено\')">Сбросить статус</button><button onclick="routeRemove('+i+')">Убрать из маршрута</button></div></details></section>'}).join('')||'<section><small>Нет точек по выбранному фильтру.</small></section>'}
function routeRefresh(){let el=$('routeCards');if(el)el.innerHTML=routeCards()}
function routeUI(){let day=routeDate(),rows=routeRows(day),dow=new Date(day+'T12:00:00').getDay(),visited=rows.filter(r=>r.status==='Посещено').length,closed=rows.filter(r=>r.status==='Закрыто').length,no=rows.filter(r=>r.status==='Без заказа').length,done=visited+closed+no;return '<div class="pagehead">Мой маршрут</div><section class="rthero"><div class="rttop"><div class="rtname"><small>Рабочий день</small><h3>'+esc(new Date(day+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}))+'</h3></div><button class="rtsecondary" onclick="delete s.routeDay;save();render()">Сегодня</button></div><div class="rtdate"><button aria-label="Предыдущий день" onclick="routeShift(-1)">‹</button><input aria-label="Дата маршрута" type="date" value="'+esc(day)+'" onchange="if(this.value){s.routeDay=this.value;save();render()}"><button aria-label="Следующий день" onclick="routeShift(1)">›</button></div><div class="rtweek">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((n,i)=>'<button class="'+((dow||7)===i+1?'rtactive':'')+'" onclick="routeWeekDay('+(i+1)+')">'+n+'<small>'+monoDay(day,i+1-(dow||7)).slice(-2)+'</small></button>').join('')+'</div><div class="rttop"><strong>Обработано '+done+' / '+rows.length+'</strong><small>'+Math.round(done/Math.max(1,rows.length)*100)+'%</small></div><progress max="'+Math.max(1,rows.length)+'" value="'+done+'"></progress><div class="rtstats">'+[[rows.length-done,'Осталось'],[visited,'Посещено'],[closed,'Закрыто'],[no,'Без заказа']].map(([v,n])=>'<div><strong>'+v+'</strong><small>'+n+'</small></div>').join('')+'</div>'+routePicker()+weekUI()+'</section><section class="rtfilters"><div class="rtfilter">'+[['all','Все'],['todo','Осталось'],['done','Обработано']].map(([k,n])=>'<button class="'+(routeFilter===k?'rtactive':'')+'" onclick="routeFilter=\''+k+'\';render()">'+n+'</button>').join('')+'</div><input type="search" placeholder="Найти точку в маршруте" value="'+esc(routeQuery)+'" oninput="routeQuery=this.value;routeRefresh()"><small>FIT · период '+esc(s.detail?.period||'нет детализации')+'</small></section><div id="routeCards">'+routeCards()+'</div>'}
function routeSave(){let day=s.routeDay||new Date().toLocaleDateString('sv-SE');s.routes??={};let old=routeRows(day);s.routes[day]=$('routeNames').value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(name=>old.find(r=>r.name===name)||{name});save();render()}

function routeNote(i,v){let day=s.routeDay||new Date().toLocaleDateString('sv-SE');s.routes??={};s.routes[day]??=routeRows(day);s.routes[day][i].note=v;save()}

function monoDay(d,n=0){let t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function monoParse(html,year){let doc=new DOMParser().parseFromString(html,'text/html'),m=doc.querySelector('#Table2')?.textContent.match(/за\s+(\d{2})\.(\d{2})/);if(!m)throw Error('Не найден день отчёта Monolit');let date=year+'-'+m[2]+'-'+m[1];if(monoDay(date)!==date)throw Error('Некорректная дата');let num=t=>Number(t.trim().replace(/\s/g,'').replace(',','.')),rows=[...doc.querySelectorAll('#Table5 tr[id="t0"]')].map(tr=>{let [id,name,q,,dal,,sum]=[...tr.cells].map(t=>t.textContent.trim());let qty=num(q),money=num(sum),reported=num(dal)*10,v=name.match(/(?:бан|бут|pet|кег)\.?\s*(\d+(?:[.,]\d+)?)/i),lit=reported===0?0:v?qty*Number(v[1].replace(',','.')):reported,cat=/flash/i.test(name)?'Flash':/lipton/i.test(name)?'Lipton':/pepsi|7up|mirinda|mountain dew/i.test(name)?'CSD':/пиво|карлсберг|х[оo]льстен|жатецкий|zatecky|большая кружка|дербес|кроненбург|garage|somersby/i.test(name)?'BEER':'Прочее';if(![qty,money,lit,reported].every(Number.isFinite))throw Error('Ошибка строки '+id);return {id,name,qty,money,lit,cat,promo:/sell[\s-]*in/i.test(name)}});if(!rows.length)throw Error('Нет товарных строк');let footer=doc.querySelector('#Table5 tr[id="t1"]');if(!footer)throw Error('Нет итоговой строки');let f=[...footer.cells].map(t=>t.textContent),total=rows.reduce((a,r)=>a+r.money,0);if(Math.abs(total-num(f[5]))>.05||rows.reduce((a,r)=>a+r.qty,0)!==num(f[1]))throw Error('Итоги не совпадают');return {date,rows,total}}
async function monoLoad(html){try{let year=prompt('Год отчёта Monolit',String(new Date().getFullYear()));if(year===null)return;if(!/^\d{4}$/.test(year))throw Error('Введите год четырьмя цифрами');let report=monoParse(html,year);s.monolit??={};if(s.monolit[report.date]&&!confirm('Заменить отчёт за '+report.date+'?'))return;s.monolit[report.date]=report;save();go(2)}catch(e){alert(e.message)}}
function monoForecast(){let d=s.forecastDate,k=s.detail?.kpi||[],period=s.detail?.period;if(!d||!period)return [];return k.filter(x=>x.plan>0).map(x=>{let cat=/flash/i.test(x.name)?'Flash':/lipton/i.test(x.name)?'Lipton':/csd/i.test(x.name)?'CSD':'BEER',goal=cat==='Flash'?100:120,add=n=>Object.values(s.monolit||{}).filter(r=>{let ship=monoDay(r.date,1);return ship>=d&&ship<monoDay(d,n)&&ship.slice(5,7)+'.'+ship.slice(0,4)===period}).flatMap(r=>r.rows).filter(r=>r.cat===cat).reduce((a,r)=>a+r.lit,0),a=x.fact/x.plan*100,b=(x.fact+add(1))/x.plan*100,c=(x.fact+add(2))/x.plan*100,left=Math.max(0,x.plan*goal/100-x.fact-add(2));return {cat,goal,a,b,c,left,plan:x.plan}})}
function monoSummary(){let f=monoForecast();return '<section><h3>Прогноз KPI</h3>'+(f.length?f.map(x=>'<div>'+esc(x.cat)+' · <b>'+fmt(x.c)+'%</b> · '+fmt(x.c-x.a)+' п.п.</div>').join(''):'<small>Загрузите детализацию и подтвердите её дату.</small>')+'<p><button onclick="go(2)">Открыть прогноз</button></p></section>'}
function monoUI(){let f=monoForecast(),d=s.forecastDate||'',reports=Object.values(s.monolit||{}).sort((a,b)=>b.date.localeCompare(a.date));return '<div class="pagehead">Продажи и прогноз</div><section><h3>Monolit · ежедневные отчёты</h3><input type="file" accept=".html,.htm" onchange="if(this.files[0])this.files[0].text().then(monoLoad)"><button onclick="importShortcut()">Из буфера WhatsApp</button><textarea id="shortcutpaste" placeholder="Вставьте Base64"></textarea><button onclick="importShortcut(true)">Обработать</button><p id="shortcutstatus"></p><label>Дата утренней детализации (подтвердите после загрузки KPI)</label><input type="date" value="'+esc(d)+'" onchange="s.forecastDate=this.value;save();render()"><small>Период KPI: '+esc(s.detail?.period||'не загружен')+'. Заявка → отгрузка +1 день → детализация +2 дня. Sell-in включён.</small></section>'+(f.length?'<section><h3>Динамика · '+esc(d)+' → '+monoDay(d,2)+'</h3>'+[monoDay(d,-1),d].map(day=>'<small>'+day+': '+(s.monolit?.[day]?'отчёт загружен':'нет отчёта')+'</small><br>').join('')+f.map((x,i)=>'<div class="task"><b>'+x.cat+' · цель '+x.goal+'%</b>'+[x.a,x.b,x.c].map((v,j)=>'<div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><div style="height:12px;border-radius:5px;background:'+['#94a3b8','#5293df','#20a875'][j]+';width:'+Math.min(100,Math.max(0,v/Math.max(170,x.c)*100))+'%"></div></div><small>'+fmt(v)+'%</small></div>').join('')+'<h2>'+fmt(x.c)+'%</h2><small>Прирост '+fmt(x.c-x.a)+' п.п. · Осталось '+fmt(x.left)+' л / '+Math.ceil(x.left/10.32)+' уп.</small><label>Дополнительные упаковки 24 × 0,43 л</label><input type="number" min="0" step="1" value="'+Math.ceil(x.left/10.32)+'" oninput="document.getElementById(\'monoSim'+i+'\').textContent=('+x.c+'+Math.max(0,Number(this.value)||0)*10.32/'+x.plan+'*100).toFixed(2)+\'%\'"><b id="monoSim'+i+'">'+fmt(x.c+Math.ceil(x.left/10.32)*10.32/x.plan*100)+'%</b></div>').join('')+'<small>Прогноз при полной отгрузке; симуляция упаковок условная.</small></section>':'')+'<section><h3>История Monolit</h3>'+reports.map(r=>'<details><summary>'+esc(r.date)+' · '+fmt(r.total)+' ₸</summary>'+['BEER','Flash','CSD','Lipton','Прочее'].map(cat=>'<p>'+cat+': '+fmt(r.rows.filter(x=>x.cat===cat).reduce((a,x)=>a+x.lit,0))+' л</p>').join('')+'<small>Sell-in: '+fmt(r.rows.filter(x=>x.promo).reduce((a,x)=>a+x.lit,0))+' л</small><p><button onclick="if(confirm(\'Удалить отчёт?\')){delete s.monolit[\''+r.date+'\'];save();render()}">Удалить</button></p></details>').join('')+'</section>'}
