<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIX Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#eef3fa;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px 16px}section{background:#1b2533;border-radius:16px;padding:16px;margin:12px 0}input,select,textarea,button{font:inherit;border:1px solid #46566b;border-radius:9px;padding:10px;color:white;background:#111923}input,textarea,select{width:100%;margin:6px 0 12px}button{background:#245fa9;cursor:pointer}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{font-size:13px}small,label{color:#aab8cb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}progress{width:100%;accent-color:#51c99b}.money{color:#51c99b;font-size:30px}.task{border-top:1px solid #46566b;padding:12px 0}</style><main><h1>MIX Assistant</h1><small>v0.7 · Локальное хранение</small><nav id="nav"></nav><div id="view"></div></main><script>
const initial={kpi:['BEER','Flash','CSD','Lipton'].map(name=>({name,fact:0,plan:0})),tasks:[],sales:[],clients:[],stock:[],pay:{base:0,bonus:0,ho:0,km:0,norm:0,price:0,amort:0}};let s;try{s=JSON.parse(localStorage.getItem('mix-v1'))||initial}catch{s=initial}let tab=0;const tabs=['Главная','Задачи','Продажи','Клиенты','Склад','Зарплата','Документы','Детализация','ChatGPT'];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});function save(){try{localStorage.setItem('mix-v1',JSON.stringify(s))}catch{alert('Не удалось сохранить данные')}}function go(i){tab=i;render()}function pay(){let p=s.pay;return +p.base + +p.bonus + +p.ho + +p.km*+p.norm/100*+p.price + +p.amort}
function render(){$('nav').innerHTML=tabs.map((t,i)=>'<button onclick="go('+i+')">'+t+'</button>').join('');let h='';if(tab===0){h='<div class="grid">'+s.kpi.map(k=>{let p=k.plan?k.fact/k.plan*100:0;return '<section><small>'+k.name+'</small><h2>'+(k.plan?fmt(p)+'%':'—')+'</h2><progress max="120" value="'+Math.min(120,p)+'"></progress><small>До 120%: '+(k.plan?fmt(Math.max(0,k.plan*1.2-k.fact))+' л':'—')+'</small></section>'}).join('')+'</div><section>Открытых задач: '+s.tasks.filter(t=>!t.done).length+'</section><section><h3>Обновить KPI</h3>'+s.kpi.map((k,i)=>'<label>'+k.name+': факт / план, л</label><div class="grid"><input type="number" min="0" id="f'+i+'" value="'+k.fact+'"><input type="number" min="0" id="p'+i+'" value="'+k.plan+'"></div>').join('')+'<button onclick="updateKpi()">Сохранить</button></section><button onclick="backup()">Экспорт данных</button>'}else if(tab===1){h='<section><h3>Новое поручение</h3><label>Задача</label><textarea id="task"></textarea><label>Супервайзер</label><input id="boss"><label>Срок</label><input type="date" id="due"><label>Приоритет</label><select id="priority"><option>Обычный</option><option>Высокий</option><option>Срочный</option></select><button onclick="addTask()">Добавить</button></section><section><h3>Реестр задач</h3>'+(s.tasks.map((t,i)=>'<div class="task"><b>'+esc(t.name)+'</b><br><small>'+esc(t.boss)+' · '+esc(t.due||'Без срока')+' · '+esc(t.priority)+(t.done?' · Выполнено':t.due&&t.due<new Date().toLocaleDateString('sv-SE')?' · ПРОСРОЧЕНО':'')+'</small><br><button onclick="toggle('+i+')">'+(t.done?'Возобновить':'Выполнено')+'</button> <button onclick="del(\'tasks\','+i+')">Удалить</button></div>').join('')||'Пока нет задач')+'</section>'}else if(tab===5){h='<section><h3>Расчёт начислений</h3><label>Импорт авторасчёта ЦОТ (Excel)</label><input type="file" accept=".xlsx" onchange="if(this.files[0])readPayroll(this.files[0])"><div id="payimport"></div>'+Object.entries({base:'Оклад, ₸',bonus:'Премии, ₸',ho:'Премия ХО, ₸',km:'Пробег, км',norm:'Норма топлива, л/100 км',price:'Цена топлива, ₸/л',amort:'Амортизация, ₸'}).map(([k,v])=>'<label>'+v+'</label><input type="number" min="0" id="pay_'+k+'" value="'+s.pay[k]+'">').join('')+'<button onclick="updatePay()">Пересчитать</button><h2 class="money">'+fmt(pay())+' ₸</h2><small>Налоги не учтены.</small></section>'}else if(tab===8){h=chatUI()}else if(tab===7){h=detailUI()}else if(tab===4){h=stockUI()}else if(tab===6){h='<section><h3>Загрузка документов</h3><label>Тип документа</label><select id="doctype"><option>Детализация KPI</option><option>Складские остатки</option><option>Клиентская база</option><option>Дневные продажи</option><option>Накладные</option></select><input type="file" id="docfile" multiple accept=".xlsx,.xls,.csv,.pdf,.txt,image/*"><textarea id="pastezone" placeholder="Нажми сюда и выбери Вставить или Ctrl+V" onpaste="pasteDocs(event)" ondragover="event.preventDefault()" ondrop="dropDocs(event)"></textarea><button onclick="readClipboard()">Вставить из буфера</button> <button onclick="uploadDocs()">Сохранить файлы</button><p id="docstatus"></p><small>Файлы сохраняются на устройстве. Анализ складского PDF доступен в разделе Склад. Анализ KPI доступен в разделе Детализация.</small></section><section id="doclist">Загрузка списка…</section>';setTimeout(listDocs,0)}else if(tab===3){h='<section><h3>Клиентская база · '+s.clients.length+' ТТ</h3><label>Импорт списка (название; адрес; ИП)</label><input type="file" id="clientfile" accept=".csv,.txt"><button onclick="importClients()">Импортировать</button><input id="clientsearch" placeholder="Поиск точки" oninput="filterClients(this.value)"><label>Название</label><input id="a"><label>Адрес / ИП</label><input id="b"><button onclick="addRow(\'clients\')">Добавить</button></section><section id="clientlist">'+clientRows('')+'</section>'}else{let [key,title,a,b]={2:['sales','Продажа','Торговая точка','Объём, л'],3:['clients','Клиент','Название','Адрес / заметка'],4:['stock','Остаток','Товар','Количество / единица']}[tab];h='<section><h3>'+title+'</h3><label>'+a+'</label><input id="a"><label>'+b+'</label><input id="b"><button onclick="addRow(\''+key+'\')">Добавить</button></section><section>'+(s[key].map((r,i)=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><small>'+esc(r.date)+'</small><br><button onclick="del(\''+key+'\','+i+')">Удалить</button></div>').join('')||'Нет записей')+'</section>'}$('view').innerHTML=h}

let payrollRows=[];
async function readPayroll(file){let el=$('payimport');el.textContent='Читаю Excel…';try{let x=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'),w=x.read(await file.arrayBuffer(),{type:'array'}),sheet=w.SheetNames.find(n=>n.includes('Авторасчет ЦОТ'));if(!sheet)throw Error('Не найден лист авторасчёта ЦОТ');let a=x.utils.sheet_to_json(w.Sheets[sheet],{header:1,defval:null}),h=a[0],idx=t=>h.findIndex(v=>String(v).trim()===t);if(idx('Маршрут')<0||idx('Окладная часть')<0)throw Error('Не найдены обязательные столбцы');payrollRows=a.slice(1).filter(r=>r[idx('Маршрут')]&&r[idx('Окладная часть')]).map(r=>({name:r[idx('Маршрут')],base:r[idx('Окладная часть')],bonus:r[idx('Тотал стоимость услуг')],travel:r[45],km:r[idx('пройдено км')],metrics:['BEER','LIPTON','CSD',' Flash-Up'].map(n=>({name:n.trim(),plan:r[idx('Вторичные продажи '+n+', план')],fact:r[idx('Вторичные продажи '+n+', факт')],amount:r[idx('Вторичные продажи '+n+', сумма')]}))}));el.innerHTML='<label>Выберите свой маршрут</label><select id="payroute" onchange="previewPayroll()"><option value="">Выберите</option>'+payrollRows.map((r,i)=>'<option value="'+i+'">'+esc(r.name)+'</option>').join('')+'</select><div id="paypreview"></div>'}catch(e){el.textContent='Ошибка: '+e.message}}
function previewPayroll(){let v=$('payroute').value,el=$('paypreview');if(v===''){el.textContent='';return}let r=payrollRows[+v];el.innerHTML='<p>Оклад: '+fmt(r.base)+' ₸ · Начисления KPI: '+fmt(r.bonus)+' ₸ · ГСМ и амортизация: '+fmt(r.travel)+' ₸</p>'+r.metrics.map(m=>'<div>'+esc(m.name)+': '+fmt(m.fact)+' / '+fmt(m.plan)+' · '+fmt(m.amount)+' ₸</div>').join('')+'<p><small>Исторический расчёт. Не заменяет текущие KPI и прогноз.</small></p>'}

function detailUI(){let d=s.detail;return '<section><h3>Детализация KPI</h3><input type="file" accept=".xlsx,.xls" onchange="if(this.files[0])loadDetail(this.files[0])"><textarea placeholder="Вставьте Excel из буфера" onpaste="detailPaste(event)"></textarea><button onclick="detailClipboard()">Вставить из буфера</button><p id="detailstatus"></p><small>'+esc(d?.name||'Отчёт не загружен')+'</small></section>'+(d?'<section><h3>План продаж</h3><label>Цель, %</label><select id="dgoal" onchange="detailResults()"><option>90</option><option selected>100</option><option>110</option><option>120</option></select><label>Осталось рабочих дней</label><input id="ddays" type="number" min="1" value="2" onchange="detailResults()"><div id="dresults">'+detailMetrics(100,2)+'</div><p>Пробег: '+fmt(d.km)+' км</p><p>Визиты: '+fmt(d.visits.fact)+' / '+fmt(d.visits.plan)+'</p></section><section><h3>Flash: незакрытые позиции</h3><small>Нет положительного значения в отчёте за месяц; пустые ячейки не доказывают отсутствие продаж.</small><input placeholder="Поиск магазина" oninput="detailShops(this.value)"><div id="dshops">'+shopRows('')+'</div></section><section><h3>FIT по точкам</h3>'+d.fit.map(t=>'<div class="task">'+esc(t.name)+'<br>Beer: '+fmt(t.beer*100)+'% · NonAlco: '+fmt(t.non*100)+'%</div>').join('')+'</section>':'')}
function detailMetrics(goal,days){let d=s.detail,p=s.detailPrevious;return d.kpi.map(k=>{let old=d.period&&p?.period===d.period?p.kpi.find(x=>x.name===k.name):null,left=Math.max(0,k.plan*goal/100-k.fact);return '<div class="task"><b>'+k.name+' · '+fmt(k.fact/k.plan*100)+'%</b><br>'+fmt(k.fact)+' / '+fmt(k.plan)+' л<br>До '+goal+'%: '+fmt(left)+' л · '+fmt(left/days)+' л/день'+(k.name==='Flash'?' · '+Math.ceil(left/days/10.32)+' уп. 0,43 × 24/день':'')+(old?'<br>Изменение: '+fmt(k.fact-old.fact)+' л':'')+'</div>'}).join('')}
function detailResults(){$('dresults').innerHTML=detailMetrics(+$('dgoal').value,Math.max(1,+$('ddays').value))}
function shopRows(q){return s.detail.shops.filter(t=>t.name.toLowerCase().includes(q.toLowerCase())).map(t=>'<div class="task"><b>'+esc(t.name)+'</b><br>'+esc(t.missing.join('; ')||'Все выбранные группы имеют положительное значение')+'</div>').join('')||'Нет точек'}
function detailShops(q){$('dshops').innerHTML=shopRows(q)}
function detailPaste(e){let f=Array.from(e.clipboardData.files||[])[0];if(f){e.preventDefault();loadDetail(f)}else{e.preventDefault();$('detailstatus').textContent='Буфер не передал Excel целиком. Выберите файл.'}}
async function detailClipboard(){try{let items=await navigator.clipboard.read();for(let i of items){let t=i.types.find(t=>/spreadsheet|excel/.test(t));if(t){await loadDetail(new File([await i.getType(t)],'Детализация из буфера.xlsx',{type:t}));return}}throw Error()}catch{$('detailstatus').textContent='Браузер не передал Excel. Используйте выбор файла.'}}
async function loadDetail(file){let el=$('detailstatus');el.textContent='Читаю Excel…';try{let x=await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm'),w=x.read(await file.arrayBuffer(),{type:'array'}),read=n=>{if(!w.Sheets[n])throw Error('Нет листа '+n);return x.utils.sheet_to_json(w.Sheets[n],{header:1,defval:null,range:0,blankrows:true})},a=read('Sheet1'),v=read('Sheet2'),m=read('Sheet3'),b=read('Sheet4'),f=read('Sheet5'),num=z=>typeof z==='number'&&Number.isFinite(z),period=a.slice(0,8).flat().map(z=>String(z??'')).join(' ').match(/(?:^|\D)(0[1-9]|1[0-2])\.(20\d{2})(?!\d)/)?.[0]?.trim()||file.name.match(/(20\d{2})(0[1-9]|1[0-2])\d{2}/)?.slice(1,3).reverse().join('.')||null;let norm=z=>String(z??'').trim().toLowerCase().replace(/\s+/g,' '),kh=a.findIndex(r=>norm(r[2]).includes('kpi')),sh=b.findIndex(r=>norm(r[4])==='shop id');if(kh<0||sh<0)throw Error('Не найдены заголовки: KPI '+kh+', Shop Id '+sh+'. Листы: '+w.SheetNames.join(', '));let kpi=['BEER','Flash','CSD','Lipton'].map((name,i)=>{let r=a.slice(kh+1).find(r=>norm(r[2]).includes(name.toLowerCase())&&num(r[5])&&num(r[7]));if(!String(r?.[2]).toLowerCase().includes(name.toLowerCase())||!num(r[5])||!num(r[7])||r[7]<=0)throw Error('Некорректный KPI '+name);return {name,fact:r[5]*10,plan:r[7]*10}});let visits={plan:0,fact:0};for(let r of v.slice(9))if(r[4]&&r[5]&&num(r[7])&&num(r[8])){visits.plan+=r[7];visits.fact+=r[8]}let km=m.slice(6).filter(r=>num(r[2])&&num(r[4])).reduce((a,r)=>a+r[4],0);let groups=[{name:'Ultra',re:/ultra.*0[.,]4[35]/i},{name:'Classic',re:/energy.*0[.,]4[35]/i},{name:'0,25',re:/0[.,]25/i}];let cols=b[sh].map((n,i)=>({n:String(n||''),i})).filter(o=>o.i>=35&&o.i<=46);groups[1].re=/^(?!.*(?:ultra|bubble|exotic|mojito|pomegranate|night|peach|morning|berry|tropical|mango|apple)).*energy.*0[.,]4[35]/i;let shops=new Map(),cur=null;for(let r of b.slice(sh+1)){if(r[4]&&r[6]){cur=String(r[4]);if(!shops.has(cur))shops.set(cur,{name:String(r[6]).trim(),seen:groups.map(()=>false)})}if(!cur||!num(r[12]))continue;let t=shops.get(cur);groups.forEach((g,i)=>{if(cols.some(o=>g.re.test(o.n)&&num(r[o.i])&&r[o.i]>0))t.seen[i]=true})}let report={name:file.name,period,kpi,visits,km,shops:[...shops.values()].map(t=>({name:t.name,missing:groups.filter((g,i)=>cols.some(o=>g.re.test(o.n))&&!t.seen[i]).map(g=>g.name)})),fit:f.slice(8).filter(r=>r[3]&&r[4]&&num(r[17])&&num(r[23])).map(r=>({name:String(r[4]).trim(),beer:r[17],non:r[23]}))};if(s.detail&&JSON.stringify(s.detail.kpi)!==JSON.stringify(kpi))s.detailPrevious=s.detail;s.detail=report;s.kpi=kpi;save();if(tab===7){render();$('detailstatus').textContent='Обработано: 5 листов'}}catch(e){el.textContent='Ошибка: '+e.message}}

function chatUI(){return '<section><h3>Передача в ChatGPT</h3><small>Выберите данные. Они не отправляются автоматически.</small>'+[['kpi','KPI и сравнение'],['shops','Незакрытый ассортимент'],['stock','Складские остатки'],['tasks','Открытые задачи'],['pay','Прогноз зарплаты'],['clients','Клиентская база']].map(([k,n],i)=>'<label style="display:block"><input style="width:auto" type="checkbox" id="chat_'+k+'" '+(i===0||i===2?'checked':'')+' onchange="prepareChat()">'+n+'</label>').join('')+'<label>Что нужно проанализировать?</label><select id="chatgoal" onchange="prepareChat()"><option>Составь план продаж на день</option><option>Проанализируй выполнение KPI</option><option>Найди точки с незакрытым ассортиментом</option><option>Проанализируй зарплату</option><option>Проверь задачи</option><option>Другой вопрос</option></select><textarea id="chatquestion" placeholder="Дополнительный вопрос" oninput="prepareChat()"></textarea><button onclick="prepareChat()">Сформировать отчёт</button><textarea id="chatreport" rows="12" placeholder="Здесь появится отчёт"></textarea><button onclick="copyChat()">Копировать отчёт</button> <button onclick="shareChat()">Поделиться</button> <button onclick="window.open(\'https://chatgpt.com/\',\'_blank\',\'noopener\')">Открыть ChatGPT</button><p id="chatstatus"></p><small>На iPhone можно попробовать меню Поделиться. Для передачи в существующий проект скопируйте отчёт и вставьте в нужный чат. Проверьте конфиденциальность данных перед отправкой.</small></section>'}
function prepareChat(){let data={},on=k=>$('chat_'+k).checked;if(on('kpi')){data.kpi=s.kpi;data.period=s.detail?.period||null;data.source=s.detail?.name||'Ручной ввод';data.previous=s.detailPrevious?.kpi||null;data.previousPeriod=s.detailPrevious?.period||null}if(on('shops'))data.shops=s.detail?.shops||[];if(on('stock'))data.stock=s.stockReport?{source:s.stockReport.name,rows:s.stockReport.rows}:s.stock;if(on('tasks'))data.tasks=s.tasks.filter(t=>!t.done);if(on('pay'))data.pay={...s.pay,estimatedGross:pay()};if(on('clients'))data.clients=s.clients;$('chatreport').value='MIX Assistant — рабочий отчёт\nСформирован: '+new Date().toLocaleString('ru-RU')+'\nЗапрос: '+$('chatgoal').value+'\n'+$('chatquestion').value+'\nИспользуй только переданные данные; укажи отсутствующие показатели. KPI в литрах, склад в штуках, зарплата в тенге.\n'+JSON.stringify(data,null,2)}
async function copyChat(){if(!$('chatreport').value)prepareChat();try{await navigator.clipboard.writeText($('chatreport').value);$('chatstatus').textContent='Скопировано. Вставьте в нужный чат ChatGPT.'}catch{$('chatreport').focus();$('chatreport').select();$('chatstatus').textContent='Выделите и скопируйте текст вручную.'}}
async function shareChat(){if(!$('chatreport').value)prepareChat();try{if(!navigator.share)throw Error();await navigator.share({title:'MIX Assistant',text:$('chatreport').value})}catch(e){if(e.name!=='AbortError')$('chatstatus').textContent='Используйте кнопку Копировать отчёт.'}}
function stockUI(){let f=s.stockFilters||{limit:10,cat:'Все',keg:false,bib:false,dup:true,dis:true};return '<section><h3>Складские остатки</h3><input type="file" id="stockfile" accept=".pdf,.txt" onchange="if(this.files[0])loadStock(this.files[0])"><textarea id="stockpaste" placeholder="Вставьте PDF или текст таблицы" onpaste="stockPaste(event)"></textarea><button onclick="stockClipboard()">Вставить из буфера</button><p id="stockstatus"></p><small>'+esc(s.stockReport?.name||'Отчёт не загружен')+'</small></section><section><h3>Фильтры</h3><label>Категория</label><select id="scat" onchange="stockFilter()">'+['Все','BEER','FLASH','CSD','LIPTON'].map(x=>'<option '+(x===f.cat?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Меньше упаковок (0 — только нулевые)</label><input id="slimit" type="number" min="0" value="'+f.limit+'" onchange="stockFilter()">'+[['keg','Показывать кеги'],['bib','Показывать БИБ'],['dup','Объединять объёмы Flash'],['dis','Скрывать снятые Flash']].map(([k,t])=>'<label style="display:block"><input style="width:auto" type="checkbox" id="s'+k+'" '+(f[k]?'checked':'')+' onchange="stockFilter()"> '+t+'</label>').join('')+'<button onclick="copyStock()">Копировать список</button></section><section id="stockresults">'+stockResults()+'</section>'}
function stockFilter(){s.stockFilters={cat:$('scat').value,limit:Math.max(0,+$('slimit').value),keg:$('skeg').checked,bib:$('sbib').checked,dup:$('sdup').checked,dis:$('sdis').checked};save();$('stockresults').innerHTML=stockResults()}
function parseStock(lines){let rows=[];for(let line of lines){let m=line.trim().match(/^(.*?),\s*(бан|бут\.?|кега|шт\.?)\s+([\d \u00a0\u202f]+),(\d{3})$/i);if(!m)continue;let name=m[1].trim(),qty=Number(m[3].replace(/\s/g,''))+Number(m[4])/1000,pack=Number(name.match(/\*\s*(\d+)/)?.[1]||1),cat=/flash/i.test(name)?'FLASH':/липтон|lipton/i.test(name)?'LIPTON':/пиво|garage|somersby/i.test(name)?'BEER':'CSD';rows.push({name,qty,pack,cat,keg:/кега/i.test(m[2]),bib:/биб/i.test(name)})}return rows}
async function loadStock(file){let status=$('stockstatus');if(status)status.textContent='Читаю отчёт…';try{let lines=[];if(/\.pdf$/i.test(file.name)||file.type==='application/pdf'){let pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';let pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),tc=await page.getTextContent(),groups=[];for(let item of tc.items){if(!item.str?.trim())continue;let y=item.transform[5],g=groups.find(g=>Math.abs(g.y-y)<2);if(!g){g={y,items:[]};groups.push(g)}g.items.push(item)}for(let g of groups.sort((a,b)=>b.y-a.y))lines.push(g.items.sort((a,b)=>a.transform[4]-b.transform[4]).map(x=>x.str).join(' '))}}else lines=(await file.text()).split(/\r?\n/);let rows=parseStock(lines);if(!rows.length)throw Error('Не найдены строки остатков. Проверьте формат PDF.');if(s.stockReport&&s.stockReport.name!==file.name)s.stockPrevious=s.stockReport;s.stockReport={name:file.name,rows,date:new Date().toISOString()};save();if(tab===4){render();$('stockstatus').textContent='Распознано позиций: '+rows.length}}catch(e){if(status)status.textContent='Ошибка: '+e.message;else alert(e.message)}}
function stockPaste(e){let f=Array.from(e.clipboardData.files||[])[0],t=e.clipboardData.getData('text/plain');if(f||t){e.preventDefault();loadStock(f||new File([t],'Вставленные остатки.txt',{type:'text/plain'}))}}
async function stockClipboard(){try{let items=await navigator.clipboard.read();for(let item of items){let type=item.types.includes('application/pdf')?'application/pdf':item.types.includes('text/plain')?'text/plain':null;if(type){let blob=await item.getType(type);await loadStock(new File([blob],type==='application/pdf'?'Остатки из буфера.pdf':'Остатки из буфера.txt',{type}));return}}throw Error()}catch{alert('Вставьте в текстовое поле или выберите PDF. Safari может не передавать PDF через буфер.')}}
function filteredStock(){let f=s.stockFilters||{limit:10,cat:'Все',keg:false,bib:false,dup:true,dis:true},rows=(s.stockReport?.rows||[]).filter(r=>(f.keg||!r.keg)&&(f.bib||!r.bib)&&(!f.dis||!/flash.*(night movie|peach pineapple)/i.test(r.name)));if(f.dup){let map=new Map();for(let r of rows){let key=r.cat==='FLASH'?r.name.toLowerCase().replace(/т\/у|бан\.?|can|\d+[.,]\d+\s*\*\s*\d+/g,'').replace(/[\s,]+/g,' ').trim():r.name;if(!map.has(key)||map.get(key).qty<r.qty)map.set(key,r)}rows=[...map.values()]}return rows.filter(r=>(f.cat==='Все'||r.cat===f.cat)&&(r.qty===0||r.qty/r.pack<f.limit)).sort((a,b)=>a.cat.localeCompare(b.cat)||a.qty/a.pack-b.qty/b.pack)}
function stockResults(){if(!s.stockReport)return 'Загрузите отчёт';let rows=filteredStock(),prev=new Map((s.stockPrevious?.rows||[]).map(r=>[r.name,r.qty]));return '<h3>Дефицит · '+rows.length+'</h3>'+ (rows.map(r=>'<div class="task"><small>'+r.cat+' · '+(r.qty===0?'НЕТ':r.qty/r.pack<5?'КРИТИЧЕСКИЙ':'МАЛО')+'</small><br><b>'+esc(r.name)+'</b><br>'+fmt(r.qty)+' шт. · '+Math.floor(r.qty/r.pack)+' полных уп.'+(prev.has(r.name)?' · Δ '+fmt(r.qty-prev.get(r.name))+' шт.':'')+'</div>').join('')||'Нет позиций по фильтрам')+'<small>Отсутствующие в отчёте позиции не считаются нулевыми.</small>'}
async function copyStock(){let rows=filteredStock(),t=['Остатки '+(s.stockReport?.name||''),...rows.map(r=>r.cat+' | '+r.name+' — '+r.qty+' шт. / '+Math.floor(r.qty/r.pack)+' уп.')].join('\n');try{await navigator.clipboard.writeText(t);alert('Список скопирован')}catch{alert('Не удалось скопировать')}}
function pasteDocs(e){let files=Array.from(e.clipboardData.files||[]);if(!files.length)files=Array.from(e.clipboardData.items||[]).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();uploadDocs(files)}else{let t=e.clipboardData.getData('text/plain');if(t){e.preventDefault();uploadDocs([new File([t],'Вставленный текст.txt',{type:'text/plain'})])}}}function dropDocs(e){e.preventDefault();let files=Array.from(e.dataTransfer.files);if(files.length)uploadDocs(files)}async function readClipboard(){try{let items=await navigator.clipboard.read(),files=[];for(let item of items){let type=item.types.find(t=>t!=='text/plain'&&t!=='text/html')||item.types.find(t=>t==='text/plain');if(!type)continue;let blob=await item.getType(type),ext=({'image/png':'png','image/jpeg':'jpg','application/pdf':'pdf','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','text/plain':'txt'})[type]||'bin';files.push(new File([blob],'Буфер-'+Date.now()+'-'+files.length+'.'+ext,{type}))}if(files.length)uploadDocs(files);else alert('Буфер не содержит доступных файлов')}catch{alert('Браузер не разрешил чтение буфера. Нажмите на поле вставки и выберите Вставить. Если файл не передаётся, используйте выбор файла.')}}function docDB(){return new Promise((ok,no)=>{let r=indexedDB.open('mix-documents',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function uploadDocs(incoming){let files=incoming||Array.from($('docfile').files),type=$('doctype').value;if(!files.length)return alert('Выберите файл');try{let db=await docDB(),tx=db.transaction('files','readwrite');for(let file of files)tx.objectStore('files').add({file,name:file.name,type,date:new Date().toLocaleString('ru-RU')});await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=no;tx.onabort=no});db.close();if($('docstatus'))$('docstatus').textContent='Сохранено: '+files.length;listDocs()}catch(e){alert('Не удалось сохранить файлы')}}async function listDocs(){try{let db=await docDB(),r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>{if($('doclist'))$('doclist').innerHTML=r.result.map(d=>'<div class="task"><b>'+esc(d.name)+'</b><br><small>'+esc(d.type)+' · '+esc(d.date)+'</small><br><button onclick="getDoc('+d.id+')">Открыть файл</button> <button onclick="deleteDoc('+d.id+')">Удалить</button></div>').join('')||'Нет документов';db.close()}}catch(e){if($('doclist'))$('doclist').textContent='Хранилище недоступно'}}async function getDoc(id){let db=await docDB(),r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>{if(r.result){let a=document.createElement('a');a.href=URL.createObjectURL(r.result.file);a.download=r.result.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}db.close()}}async function deleteDoc(id){if(!confirm('Удалить файл?'))return;let db=await docDB(),tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();listDocs()}}function clientRows(q){return s.clients.map((r,i)=>({r,i})).filter(({r})=>(r.a+' '+r.b).toLowerCase().includes(q.toLowerCase())).map(({r,i})=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><button onclick="del(\'clients\','+i+')">Удалить</button></div>').join('')||'Нет записей'}function filterClients(q){$('clientlist').innerHTML=clientRows(q)}async function importClients(){let f=$('clientfile').files[0];if(!f)return alert('Выберите файл');let rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.split(';').map(y=>y.trim())).filter(x=>x.length>=2&&x[0]&&x[0]!=='Название');let n=0;for(let [a,address,ip] of rows){let b=address+(ip?' · '+ip:'');if(!s.clients.some(r=>r.a===a&&r.b===b)){s.clients.push({a,b,date:new Date().toLocaleDateString('ru-RU')});n++}}save();render();alert('Добавлено: '+n)}function updateKpi(){s.kpi.forEach((k,i)=>{k.fact=Math.max(0,+$('f'+i).value);k.plan=Math.max(0,+$('p'+i).value)});save();render()}function addTask(){if(!$('task').value.trim())return;s.tasks.push({name:$('task').value,boss:$('boss').value,due:$('due').value,priority:$('priority').value,done:false});save();render()}function toggle(i){s.tasks[i].done=!s.tasks[i].done;save();render()}function del(k,i){if(confirm('Удалить запись?')){s[k].splice(i,1);save();render()}}function addRow(k){if(!$('a').value.trim())return;s[k].push({a:$('a').value,b:$('b').value,date:new Date().toLocaleDateString('ru-RU')});save();render()}function updatePay(){Object.keys(s.pay).forEach(k=>s.pay[k]=Math.max(0,+$('pay_'+k).value));save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='mix-backup.json';a.click();URL.revokeObjectURL(a.href)}render();</script></html>
