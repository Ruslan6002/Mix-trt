<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIX Assistant</title><style>*{box-sizing:border-box}body{margin:0;background:#10151e;color:#eef3fa;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px 16px}section{background:#1b2533;border-radius:16px;padding:16px;margin:12px 0}input,select,textarea,button{font:inherit;border:1px solid #46566b;border-radius:9px;padding:10px;color:white;background:#111923}input,textarea,select{width:100%;margin:6px 0 12px}button{background:#245fa9;cursor:pointer}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{font-size:13px}small,label{color:#aab8cb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}progress{width:100%;accent-color:#51c99b}.money{color:#51c99b;font-size:30px}.task{border-top:1px solid #46566b;padding:12px 0}</style><main><h1>MIX Assistant</h1><small>v0.1 · Локальное хранение</small><nav id="nav"></nav><div id="view"></div></main><script>
const initial={kpi:['BEER','Flash','CSD','Lipton'].map(name=>({name,fact:0,plan:0})),tasks:[],sales:[],clients:[],stock:[],pay:{base:0,bonus:0,ho:0,km:0,norm:0,price:0,amort:0}};let s;try{s=JSON.parse(localStorage.getItem('mix-v1'))||initial}catch{s=initial}let tab=0;const tabs=['Главная','Задачи','Продажи','Клиенты','Склад','Зарплата'];const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});function save(){try{localStorage.setItem('mix-v1',JSON.stringify(s))}catch{alert('Не удалось сохранить данные')}}function go(i){tab=i;render()}function pay(){let p=s.pay;return +p.base + +p.bonus + +p.ho + +p.km*+p.norm/100*+p.price + +p.amort}
function render(){$('nav').innerHTML=tabs.map((t,i)=>'<button onclick="go('+i+')">'+t+'</button>').join('');let h='';if(tab===0){h='<div class="grid">'+s.kpi.map(k=>{let p=k.plan?k.fact/k.plan*100:0;return '<section><small>'+k.name+'</small><h2>'+(k.plan?fmt(p)+'%':'—')+'</h2><progress max="120" value="'+Math.min(120,p)+'"></progress><small>До 120%: '+(k.plan?fmt(Math.max(0,k.plan*1.2-k.fact))+' л':'—')+'</small></section>'}).join('')+'</div><section>Открытых задач: '+s.tasks.filter(t=>!t.done).length+'</section><section><h3>Обновить KPI</h3>'+s.kpi.map((k,i)=>'<label>'+k.name+': факт / план, л</label><div class="grid"><input type="number" min="0" id="f'+i+'" value="'+k.fact+'"><input type="number" min="0" id="p'+i+'" value="'+k.plan+'"></div>').join('')+'<button onclick="updateKpi()">Сохранить</button></section><button onclick="backup()">Экспорт данных</button>'}else if(tab===1){h='<section><h3>Новое поручение</h3><label>Задача</label><textarea id="task"></textarea><label>Супервайзер</label><input id="boss"><label>Срок</label><input type="date" id="due"><label>Приоритет</label><select id="priority"><option>Обычный</option><option>Высокий</option><option>Срочный</option></select><button onclick="addTask()">Добавить</button></section><section><h3>Реестр задач</h3>'+(s.tasks.map((t,i)=>'<div class="task"><b>'+esc(t.name)+'</b><br><small>'+esc(t.boss)+' · '+esc(t.due||'Без срока')+' · '+esc(t.priority)+(t.done?' · Выполнено':t.due&&t.due<new Date().toLocaleDateString('sv-SE')?' · ПРОСРОЧЕНО':'')+'</small><br><button onclick="toggle('+i+')">'+(t.done?'Возобновить':'Выполнено')+'</button> <button onclick="del(\'tasks\','+i+')">Удалить</button></div>').join('')||'Пока нет задач')+'</section>'}else if(tab===5){h='<section><h3>Расчёт начислений</h3>'+Object.entries({base:'Оклад, ₸',bonus:'Премии, ₸',ho:'Премия ХО, ₸',km:'Пробег, км',norm:'Норма топлива, л/100 км',price:'Цена топлива, ₸/л',amort:'Амортизация, ₸'}).map(([k,v])=>'<label>'+v+'</label><input type="number" min="0" id="pay_'+k+'" value="'+s.pay[k]+'">').join('')+'<button onclick="updatePay()">Пересчитать</button><h2 class="money">'+fmt(pay())+' ₸</h2><small>Налоги не учтены.</small></section>'}else if(tab===3){h='<section><h3>Клиентская база · '+s.clients.length+' ТТ</h3><label>Импорт списка (название; адрес; ИП)</label><input type="file" id="clientfile" accept=".csv,.txt"><button onclick="importClients()">Импортировать</button><input id="clientsearch" placeholder="Поиск точки" oninput="filterClients(this.value)"><label>Название</label><input id="a"><label>Адрес / ИП</label><input id="b"><button onclick="addRow(\'clients\')">Добавить</button></section><section id="clientlist">'+clientRows('')+'</section>'}else{let [key,title,a,b]={2:['sales','Продажа','Торговая точка','Объём, л'],3:['clients','Клиент','Название','Адрес / заметка'],4:['stock','Остаток','Товар','Количество / единица']}[tab];h='<section><h3>'+title+'</h3><label>'+a+'</label><input id="a"><label>'+b+'</label><input id="b"><button onclick="addRow(\''+key+'\')">Добавить</button></section><section>'+(s[key].map((r,i)=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><small>'+esc(r.date)+'</small><br><button onclick="del(\''+key+'\','+i+')">Удалить</button></div>').join('')||'Нет записей')+'</section>'}$('view').innerHTML=h}
function clientRows(q){return s.clients.map((r,i)=>({r,i})).filter(({r})=>(r.a+' '+r.b).toLowerCase().includes(q.toLowerCase())).map(({r,i})=>'<div class="task"><b>'+esc(r.a)+'</b><br>'+esc(r.b)+'<br><button onclick="del(\'clients\','+i+')">Удалить</button></div>').join('')||'Нет записей'}function filterClients(q){$('clientlist').innerHTML=clientRows(q)}async function importClients(){let f=$('clientfile').files[0];if(!f)return alert('Выберите файл');let rows=(await f.text()).replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.split(';').map(y=>y.trim())).filter(x=>x.length>=2&&x[0]&&x[0]!=='Название');let n=0;for(let [a,address,ip] of rows){let b=address+(ip?' · '+ip:'');if(!s.clients.some(r=>r.a===a&&r.b===b)){s.clients.push({a,b,date:new Date().toLocaleDateString('ru-RU')});n++}}save();render();alert('Добавлено: '+n)}function updateKpi(){s.kpi.forEach((k,i)=>{k.fact=Math.max(0,+$('f'+i).value);k.plan=Math.max(0,+$('p'+i).value)});save();render()}function addTask(){if(!$('task').value.trim())return;s.tasks.push({name:$('task').value,boss:$('boss').value,due:$('due').value,priority:$('priority').value,done:false});save();render()}function toggle(i){s.tasks[i].done=!s.tasks[i].done;save();render()}function del(k,i){if(confirm('Удалить запись?')){s[k].splice(i,1);save();render()}}function addRow(k){if(!$('a').value.trim())return;s[k].push({a:$('a').value,b:$('b').value,date:new Date().toLocaleDateString('ru-RU')});save();render()}function updatePay(){Object.keys(s.pay).forEach(k=>s.pay[k]=Math.max(0,+$('pay_'+k).value));save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='mix-backup.json';a.click();URL.revokeObjectURL(a.href)}render();</script></html>
